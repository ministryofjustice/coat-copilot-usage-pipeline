---
name: Snyk

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 1" # Weekly Monday midnight UTC
  workflow_dispatch:

permissions: {}

jobs:
  snyk-python:
    name: Snyk Python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Scan Python dependencies
        id: scan
        continue-on-error: true
        run: snyk test --severity-threshold=high --fail-on=upgradable --file=requirements.txt --command=python3 --sarif-file-output=snyk-python.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Check for SARIF file
        id: sarif
        if: always() && steps.scan.outcome != 'skipped'
        run: echo "exists=$([ -f snyk-python.sarif ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF
        if: always() && steps.sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: snyk-python.sarif
          category: snyk-python

      - name: Fail on findings
        id: fail_build
        if: steps.scan.outcome == 'failure'
        run: exit 1

      - name: Prepare Slack webhook
        if: failure() && steps.fail_build.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'push')
        id: slack_webhook
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.COAT_NOTIFICATIONS_SLACK_WEBHOOK }}
        run: |
          url=$(printf '%s' "${SLACK_WEBHOOK_URL}" | tr -d '[:space:]"')
          echo "::add-mask::${url}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Slack CVE Alert
        if: failure() && steps.fail_build.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'push')
        id: slack_cve_alert
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook-type: incoming-webhook
          webhook: ${{ steps.slack_webhook.outputs.url }}
          payload: |
            {
              "repository": "${{ github.repository }}",
              "run_id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

  snyk-container:
    name: Snyk Container
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build image
        run: docker build --tag "${{ github.sha }}" .

      - name: Scan container image
        id: scan
        continue-on-error: true
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ github.sha }}
          args: --file=Dockerfile --severity-threshold=high --fail-on=upgradable

      - name: Check for SARIF file
        id: sarif
        if: always() && steps.scan.outcome != 'skipped'
        run: echo "exists=$([ -f snyk.sarif ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF
        if: always() && steps.sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: snyk.sarif
          category: snyk-container

      - name: Fail on findings
        id: fail_build
        if: steps.scan.outcome == 'failure'
        run: exit 1

      - name: Prepare Slack webhook
        if: failure() && steps.fail_build.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'push')
        id: slack_webhook
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.COAT_NOTIFICATIONS_SLACK_WEBHOOK }}
        run: |
          url=$(printf '%s' "${SLACK_WEBHOOK_URL}" | tr -d '[:space:]"')
          echo "::add-mask::${url}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Slack CVE Alert
        if: failure() && steps.fail_build.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'push')
        id: slack_cve_alert
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook-type: incoming-webhook
          webhook: ${{ steps.slack_webhook.outputs.url }}
          payload: |
            {
              "repository": "${{ github.repository }}",
              "run_id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

  snyk-code:
    name: Snyk Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Scan source code
        id: scan
        continue-on-error: true
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Check for SARIF file
        id: sarif
        if: always() && steps.scan.outcome != 'skipped'
        run: echo "exists=$([ -f snyk-code.sarif ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF
        if: always() && steps.sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Fail on findings
        id: fail_build
        if: steps.scan.outcome == 'failure'
        run: exit 1

      - name: Prepare Slack webhook
        if: failure() && steps.fail_build.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'push')
        id: slack_webhook
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.COAT_NOTIFICATIONS_SLACK_WEBHOOK }}
        run: |
          url=$(printf '%s' "${SLACK_WEBHOOK_URL}" | tr -d '[:space:]"')
          echo "::add-mask::${url}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Slack CVE Alert
        if: failure() && steps.fail_build.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'push')
        id: slack_cve_alert
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook-type: incoming-webhook
          webhook: ${{ steps.slack_webhook.outputs.url }}
          payload: |
            {
              "repository": "${{ github.repository }}",
              "run_id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
